name = "torneo-api"
main = "src/index.js"
compatibility_date = "2024-05-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# SECRET_KEY = "admin123" # In produzione deve essere impostato con `npx wrangler secret put SECRET_KEY`

[[d1_databases]]
binding = "DB"
database_name = "torneo-db"
database_id = "00000000-0000-0000-0000-000000000000" # Dummy ID for local testing
migrations_dir = "./d1/migrations"
